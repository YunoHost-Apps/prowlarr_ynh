#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "prowlarr"
name = "Prowlarr"
description.en = "Complete management of your indexers for Radarr, Sonarr, Lidarr..."
description.fr = "Gestion complète de vos indexeurs pour Radarr, Sonarr, Lidarr..."

version = "3.1.0.5799~ynh1"

maintainers = ["tituspijean"]

[upstream]
license = "GPL-3.0-only"
website = "https://prowlarr.com"
admindoc = "https://wiki.servarr.com/prowlarr"
code = "https://github.com/Prowlarr/Prowlarr"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/prowlarr"

    [install.admin]
    type = "user"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Prowlarr/Prowlarr/releases/download/v3.1.0.5799/Prowlarr.master.3.1.0.5799.linux-core-x64.tar.gz"
    amd64.sha256 = "e9c66fd3d2c5e94ca51e2495eb9e99ee16004dc396cac4e74905d1408fe31767"

    arm64.url = "https://github.com/Prowlarr/Prowlarr/releases/download/v3.1.0.5799/Prowlarr.master.3.1.0.5799.linux-core-arm64.tar.gz"
    arm64.sha256 = "1e74262cf955ee60b8091d100a109d66402e5786ede5f3b68fa77347d562174a"
    armhf.url = "https://github.com/Prowlarr/Prowlarr/releases/download/v3.1.0.5799/Prowlarr.master.3.1.0.5799.linux-core-arm.tar.gz"
    armhf.sha256 = "4443fd8d7f7863220888f5f4aed4c39d346efed4353f0059dd0e06d19c1d261e"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Prowlarr\\.master\\..*\\.linux-core-x64\\.tar\\.gz$"
    autoupdate.asset.arm64 = "^Prowlarr\\.master\\..*\\.linux-core-arm64\\.tar\\.gz$"
    autoupdate.asset.armhf = "^Prowlarr\\.master\\..*\\.linux-core-arm\\.tar\\.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["logs"]

    [resources.ports]

    [resources.permissions]
    main.url = "/"
    main.allowed = "admins"

    api.url = "/api"
    api.allowed = "visitors"
    api.show_tile = false
    api.protected = true

    [resources.apt]
    packages = "curl, mediainfo, sqlite3"
